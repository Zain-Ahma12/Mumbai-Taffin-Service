<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Mumbai Taffin Service API banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f2a"/>
      <stop offset="0.55" stop-color="#0d4d4a"/>
      <stop offset="1" stop-color="#0f9d8a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd9e3"/>
      <stop offset="0.5" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#b6c4d2"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <circle cx="1090" cy="160" r="170" fill="#ffffff" opacity="0.05"/>
  <circle cx="1090" cy="160" r="115" fill="#ffffff" opacity="0.06"/>

  <!-- text -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="70" y="88" font-size="15" font-weight="700" letter-spacing="3" fill="#7ff0dc">OPEN SOURCE  ·  FASTAPI SHOWCASE</text>
    <text x="70" y="156" font-size="54" font-weight="800">Mumbai Taffin Service</text>
    <text x="70" y="200" font-size="22" opacity="0.92">Professional REST API patterns, kept simple and well-commented</text>

    <!-- tech chips -->
    <g font-size="15" font-weight="600" text-anchor="middle">
      <rect x="70"  y="228" width="110" height="36" rx="18" fill="#ffffff" opacity="0.16"/>
      <text x="125" y="251">FastAPI</text>
      <rect x="194" y="228" width="120" height="36" rx="18" fill="#ffffff" opacity="0.16"/>
      <text x="254" y="251">SQLModel</text>
      <rect x="328" y="228" width="120" height="36" rx="18" fill="#ffffff" opacity="0.16"/>
      <text x="388" y="251">Pydantic</text>
      <rect x="462" y="228" width="70" height="36" rx="18" fill="#ffffff" opacity="0.16"/>
      <text x="497" y="251">uv</text>
    </g>
  </g>

  <!-- tiffin carrier illustration -->
  <g transform="translate(60,0)">
    <ellipse cx="1050" cy="266" rx="86" ry="9" fill="#000000" opacity="0.28"/>
    <!-- handle -->
    <path d="M994 104 C990 24 1110 24 1106 104" fill="none" stroke="#e8eef4" stroke-width="6" stroke-linecap="round"/>
    <!-- tiers -->
    <rect x="985" y="206" width="130" height="46" rx="12" fill="url(#steel)" stroke="#8fa3b7" stroke-width="2"/>
    <rect x="985" y="156" width="130" height="46" rx="12" fill="url(#steel)" stroke="#8fa3b7" stroke-width="2"/>
    <rect x="985" y="106" width="130" height="46" rx="12" fill="url(#steel)" stroke="#8fa3b7" stroke-width="2"/>
    <!-- decorative bands -->
    <g stroke="#ff9f43" stroke-width="3" stroke-linecap="round" opacity="0.95">
      <line x1="1000" y1="229" x2="1100" y2="229"/>
      <line x1="1000" y1="179" x2="1100" y2="179"/>
      <line x1="1000" y1="129" x2="1100" y2="129"/>
    </g>
    <!-- lid + knob -->
    <rect x="995" y="90" width="110" height="18" rx="9" fill="#c3cfdb" stroke="#8fa3b7" stroke-width="2"/>
    <circle cx="1050" cy="86" r="8" fill="#ff9f43" stroke="#d9822b" stroke-width="2"/>
    <!-- side clips -->
    <rect x="976" y="104" width="9" height="150" rx="4.5" fill="#6f8397"/>
    <rect x="1115" y="104" width="9" height="150" rx="4.5" fill="#6f8397"/>
  </g>

  <!-- floating endpoint chips -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700">
    <rect x="860" y="60" width="124" height="30" rx="15" fill="#49cc90"/>
    <text x="922" y="80" fill="#fff" text-anchor="middle">POST /orders</text>
    <rect x="905" y="122" width="110" height="30" rx="15" fill="#61affe"/>
    <text x="960" y="142" fill="#fff" text-anchor="middle">GET /stats</text>
    <rect x="870" y="186" width="100" height="30" rx="15" fill="#f93e3e"/>
    <text x="920" y="206" fill="#fff" text-anchor="middle">DELETE</text>
  </g>
</svg>
