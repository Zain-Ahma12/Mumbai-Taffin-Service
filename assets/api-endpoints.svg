<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="API endpoint map" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#eef0f3" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="678" rx="16" fill="#ffffff" stroke="#e1e4e8" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="678" rx="16" fill="url(#grid)"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="24" font-weight="700" fill="#24292f">Mumbai Taffin Service  ·  API Endpoint Map</text>
    <g fill="none" stroke="#555" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M190 362 H288" marker-end="url(#arrow)"/>
      <path d="M240 362 V151 H288" marker-end="url(#arrow)"/>
      <path d="M240 362 V605 H288" marker-end="url(#arrow)"/>
      <path d="M890 362 H978" marker-end="url(#arrow)"/>
      <path d="M890 605 H935 V362"/>
    </g>
    <text x="215" y="352" font-size="11" font-weight="600" fill="#555" text-anchor="middle">HTTP</text>
    <g filter="url(#shadow)">
      <rect x="40" y="317" width="150" height="90" rx="14" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    </g>
    <text x="115" y="357" font-size="17" font-weight="700" fill="#7a5c00" text-anchor="middle">Client</text>
    <text x="115" y="380" font-size="12" fill="#7a5c00" text-anchor="middle">Swagger · curl · apps</text>
    <g filter="url(#shadow)">
      <rect x="290" y="90" width="600" height="96" rx="14" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    </g>
    <text x="310" y="120" font-size="17" font-weight="700" fill="#3d6b2f">Health</text>
    <text x="870" y="120" font-size="12" font-family="Consolas, 'Liberation Mono', monospace" fill="#3d6b2f" text-anchor="end" opacity="0.8">defined in main.py</text>
    <rect x="306" y="136" width="568" height="30" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1"/>
    <rect x="314" y="139" width="70" height="24" rx="12" fill="#61affe"/>
    <text x="349" y="155.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GET</text>
    <text x="398" y="156" font-size="13.5" font-weight="600" font-family="Consolas, 'Liberation Mono', monospace" fill="#24292f">/health</text>
    <text x="625" y="156" font-size="12.5" fill="#57606a">Liveness: status, uptime, time</text>
    <g filter="url(#shadow)">
      <rect x="290" y="214" width="600" height="296" rx="14" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    </g>
    <text x="310" y="244" font-size="17" font-weight="700" fill="#2b4d7e">Orders</text>
    <text x="870" y="244" font-size="12" font-family="Consolas, 'Liberation Mono', monospace" fill="#2b4d7e" text-anchor="end" opacity="0.8">routes/orders.py</text>
    <rect x="306" y="260" width="568" height="30" rx="8" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
    <rect x="314" y="263" width="70" height="24" rx="12" fill="#49cc90"/>
    <text x="349" y="279.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">POST</text>
    <text x="398" y="280" font-size="13.5" font-weight="600" font-family="Consolas, 'Liberation Mono', monospace" fill="#24292f">/orders/</text>
    <text x="625" y="280" font-size="12.5" fill="#57606a">Create order (starts: preparing)</text>
    <rect x="306" y="300" width="568" height="30" rx="8" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
    <rect x="314" y="303" width="70" height="24" rx="12" fill="#61affe"/>
    <text x="349" y="319.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GET</text>
    <text x="398" y="320" font-size="13.5" font-weight="600" font-family="Consolas, 'Liberation Mono', monospace" fill="#24292f">/orders/</text>
    <text x="625" y="320" font-size="12.5" fill="#57606a">List with filters &amp; pagination</text>
    <rect x="306" y="340" width="568" height="30" rx="8" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
    <rect x="314" y="343" width="70" height="24" rx="12" fill="#61affe"/>
    <text x="349" y="359.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GET</text>
    <text x="398" y="360" font-size="13.5" font-weight="600" font-family="Consolas, 'Liberation Mono', monospace" fill="#24292f">/orders/{order_id}</text>
    <text x="625" y="360" font-size="12.5" fill="#57606a">Get a single order</text>
    <rect x="306" y="380" width="568" height="30" rx="8" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
    <rect x="314" y="383" width="70" height="24" rx="12" fill="#2bbfa0"/>
    <text x="349" y="399.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PATCH</text>
    <text x="398" y="400" font-size="13.5" font-weight="600" font-family="Consolas, 'Liberation Mono', monospace" fill="#24292f">/orders/{order_id}</text>
    <text x="625" y="400" font-size="12.5" fill="#57606a">Update status or address</text>
    <rect x="306" y="420" width="568" height="30" rx="8" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
    <rect x="314" y="423" width="70" height="24" rx="12" fill="#f93e3e"/>
    <text x="349" y="439.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DELETE</text>
    <text x="398" y="440" font-size="13.5" font-weight="600" font-family="Consolas, 'Liberation Mono', monospace" fill="#24292f">/orders/{order_id}</text>
    <text x="625" y="440" font-size="12.5" fill="#57606a">Cancel order with a reason</text>
    <rect x="306" y="460" width="568" height="30" rx="8" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
    <rect x="314" y="463" width="70" height="24" rx="12" fill="#61affe"/>
    <text x="349" y="479.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GET</text>
    <text x="398" y="480" font-size="13.5" font-weight="600" font-family="Consolas, 'Liberation Mono', monospace" fill="#24292f">/orders/{order_id}/history</text>
    <text x="625" y="480" font-size="12.5" fill="#57606a">Status change history</text>
    <g filter="url(#shadow)">
      <rect x="290" y="544" width="600" height="96" rx="14" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
    </g>
    <text x="310" y="574" font-size="17" font-weight="700" fill="#8a5a00">Stats</text>
    <text x="870" y="574" font-size="12" font-family="Consolas, 'Liberation Mono', monospace" fill="#8a5a00" text-anchor="end" opacity="0.8">routes/stats.py</text>
    <rect x="306" y="590" width="568" height="30" rx="8" fill="#ffffff" stroke="#d79b00" stroke-width="1"/>
    <rect x="314" y="593" width="70" height="24" rx="12" fill="#61affe"/>
    <text x="349" y="609.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GET</text>
    <text x="398" y="610" font-size="13.5" font-weight="600" font-family="Consolas, 'Liberation Mono', monospace" fill="#24292f">/stats/daily</text>
    <text x="625" y="610" font-size="12.5" fill="#57606a">Counts per status + rates</text>
    <g filter="url(#shadow)">
      <path d="M980 290 V440 A95 28 0 0 0 1170 440 V290" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
      <ellipse cx="1075" cy="290" rx="95" ry="28" fill="#eadff0" stroke="#9673a6" stroke-width="2"/>
    </g>
    <text x="1075" y="338" font-size="17" font-weight="700" fill="#5b3f73" text-anchor="middle">Database</text>
    <text x="1075" y="358" font-size="12" fill="#5b3f73" text-anchor="middle">SQLModel · SQLite / Postgres</text>
    <rect x="1010" y="378" width="130" height="26" rx="13" fill="#ffffff" stroke="#9673a6"/>
    <text x="1075" y="396" font-size="13" font-weight="600" font-family="Consolas, 'Liberation Mono', monospace" fill="#5b3f73" text-anchor="middle">Order</text>
    <rect x="1010" y="412" width="130" height="26" rx="13" fill="#ffffff" stroke="#9673a6"/>
    <text x="1075" y="430" font-size="13" font-weight="600" font-family="Consolas, 'Liberation Mono', monospace" fill="#5b3f73" text-anchor="middle">StatusLog</text>

    <!-- lifecycle note -->
    <g filter="url(#shadow)">
      <rect x="980" y="544" width="190" height="96" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    </g>
    <text x="995" y="568" font-size="13" font-weight="700" fill="#7a5c00">Order lifecycle</text>
    <text x="995" y="588" font-size="12" fill="#7a5c00">preparing → picked_up</text>
    <text x="995" y="606" font-size="12" fill="#7a5c00">→ in_transit → delivered</text>
    <text x="995" y="626" font-size="12" font-style="italic" fill="#7a5c00">cancel only via DELETE</text>
  </g>
</svg>
